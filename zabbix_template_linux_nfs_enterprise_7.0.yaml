      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "if ('{$NFS.RPC.DEEP}' !== '1') return '[]';\nfunction decodeOctal(s){return s.replace(/\\\\([0-7]{3})/g,function(_,o){return String.fromCharCode(parseInt(o,8));});}\nfunction sourceServer(source){var p=source.indexOf(':/');var s=p>=0?source.substring(0,p):source;if(s.length>1&&s.charAt(0)==='['&&s.charAt(s.length-1)===']')s=s.substring(1,s.length-1);return s;}\nfunction ipv4(s){if(!/^(?:\\d{1,3}\\.){3}\\d{1,3}$/.test(s))return false;var a=s.split('.');for(var i=0;i<4;i++){var n=Number(a[i]);if(n<0||n>255)return false;}return true;}\nfunction uaddr(ip,port){return ip+'.'+Math.floor(port/256)+'.'+(port%256);}\nvar out=[],seen={},lines=value.split(/\\r?\\n/);\nfor(var i=0;i<lines.length;i++){\n var f=lines[i].trim().split(/\\s+/); if(f.length<4||(f[2]!=='nfs'&&f[2]!=='nfs4'))continue;\n var opts=decodeOctal(f[3]); var vm=opts.match(/(?:^|,)(?:vers|nfsvers)=([^,]+)/); var ver=vm?vm[1]:(f[2]==='nfs4'?'4':'unknown'); if(ver.charAt(0)!=='3')continue;\n var am=opts.match(/(?:^|,)mountaddr=([^,]+)/); var addr=am?am[1]:sourceServer(decodeOctal(f[0])); if(!ipv4(addr)||seen[addr])continue;\n seen[addr]=1; out.push({'{#NFS_MOUNTADDR}':addr,'{#NFS_UADDR_111}':uaddr(addr,111),'{#NFS_UADDR_2049}':uaddr(addr,2049)});\n}\nreturn JSON.stringify(out);"
