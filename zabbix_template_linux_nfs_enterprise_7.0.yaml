zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 846977d1dfed4968bc5f8bdb363285bc
    name: Templates/Operating systems
  templates:
  - uuid: 7274ab78044d4a488dc0c5942d8bb620
    template: Linux NFS by Zabbix agent active
    name: Linux NFS by Zabbix agent active
    description: "Enterprise plug-and-play NFS monitoring for Linux (v2.0.0).\n\nDefault monitoring is intentionally small and requires no per-host customization:\n- discovers active NFS/NFSv4 mounts automatically;\n- verifies persistent mounts defined in /etc/fstab;\n- detects missing mounts, wrong sources and read-only filesystems;\n- monitors capacity and forecasts exhaustion;\n- discovers NFS servers and checks TCP/2049 from the monitored client.\n\nOptional modules:\n- {$NFS.PERFORMANCE}=1 creates client-side /proc/self/mountstats performance metrics\n  (throughput, operations, RTT, execution time, queue time, retransmissions and errors).\n- {$NFS.RPC.DEEP}=1 creates functional NFSv3 rpcinfo checks for rpcbind, mountd, NFS and NLM.\n\nThe standard layer needs no UserParameter, external scripts or host-specific NFS macros.\nRPC Deep Health requires rpcinfo and a tightly-scoped system.run[] AllowKey.\nRaw topology/performance master items are not retained in history.\n"
    groups:
    - name: Templates/Operating systems
    items:
    - uuid: 4df544e2fb39429db094d2167e9678d1
      name: 'NFS topology: current mounts raw'
      type: ZABBIX_ACTIVE
      key: vfs.file.contents[/proc/self/mounts]
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      description: Raw Linux mount table used as the master item for NFS topology, availability and metadata discovery.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      tags:
      - tag: component
        value: nfs
      - tag: scope
        value: raw
    - uuid: ad46677e5a554dcabc08674982a87df5
      name: 'NFS topology: fstab raw'
      type: ZABBIX_ACTIVE
      key: vfs.file.contents[/etc/fstab]
      delay: 10m
      history: '0'
      trends: '0'
      value_type: TEXT
      description: Raw /etc/fstab used to determine which persistent NFS mounts are expected on this host.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: component
        value: nfs
      - tag: scope
        value: raw
    - uuid: 4ea69d40e27f419aa0971a42be73dbfb
      name: 'NFS performance: mountstats raw'
      type: ZABBIX_ACTIVE
      key: vfs.file.contents[/proc/self/mountstats]
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      description: Raw kernel per-mount NFS client statistics. Used only as a master item for dependent performance metrics.
      tags:
      - tag: component
        value: nfs
      - tag: scope
        value: raw
    discovery_rules:
    - uuid: f42b4b04ba1d4241be2f49472b6d1d19
      name: NFS mounts discovery (core)
      type: DEPENDENT
      key: nfs.mounts.discovery
      delay: '0'
      description: Core NFS discovery. Always enabled. Discovers active NFS/NFSv4 mounts and creates only availability, topology and capacity items. Advanced /proc/self/mountstats metrics are created by the separate optional performance discovery.
      lifetime: 30d
      lifetime_type: DELETE_AFTER
      enabled_lifetime: 1d
      enabled_lifetime_type: DISABLE_AFTER
      item_prototypes:
      - uuid: 42005a0f033b4c89b909c9a76aaef927
        name: 'NFS [{#NFS_MOUNTPOINT}]: Mount status'
        type: DEPENDENT
        key: nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"]
        history: 7d
        trends: 90d
        description: Independent check that the exact NFS source is still mounted on the discovered mountpoint. This prevents false filesystem-capacity readings after an unmount.
        valuemap:
          name: NFS availability state
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "function decodeOctal(s) {\n    return s.replace(/\\\\([0-7]{3})/g, function(_, oct) { return String.fromCharCode(parseInt(oct, 8)); });\n}\nvar targetMount = '{#NFS_MOUNTPOINT}';\nvar targetSource = '{#NFS_SOURCE}';\nvar lines = value.split(/\\r?\\n/);\nfor (var i = 0; i < lines.length; i++) {\n    var f = lines[i].trim().split(/\\s+/);\n    if (f.length < 4) continue;\n    if ((f[2] === 'nfs' || f[2] === 'nfs4') && decodeOctal(f[1]) === targetMount && decodeOctal(f[0]) === targetSource) return 1;\n}\nreturn 0;"
        master_item:
          key: vfs.file.contents[/proc/self/mounts]
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      - uuid: d1c5e73e412247339d86dff102414893
        name: 'NFS [{#NFS_MOUNTPOINT}]: Mount options'
        type: DEPENDENT
        key: nfs.mount.options["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"]
        history: 1d
        trends: '0'
        value_type: TEXT
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "function decodeOctal(s) {\n    return s.replace(/\\\\([0-7]{3})/g, function(_, oct) { return String.fromCharCode(parseInt(oct, 8)); });\n}\nvar targetMount = '{#NFS_MOUNTPOINT}';\nvar targetSource = '{#NFS_SOURCE}';\nvar lines = value.split(/\\r?\\n/);\nfor (var i = 0; i < lines.length; i++) {\n    var f = lines[i].trim().split(/\\s+/);\n    if (f.length < 4) continue;\n    if ((f[2] === 'nfs' || f[2] === 'nfs4') && decodeOctal(f[1]) === targetMount && decodeOctal(f[0]) === targetSource) return decodeOctal(f[3]);\n}\nreturn '';"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: vfs.file.contents[/proc/self/mounts]
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      - uuid: 272daf65ce2c4529803a4a86644c62a2
        name: 'NFS [{#NFS_MOUNTPOINT}]: Read-only state'
        type: DEPENDENT
        key: nfs.mount.readonly["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"]
        history: 7d
        trends: 90d
        valuemap:
          name: NFS read-only state
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "function decodeOctal(s) {\n    return s.replace(/\\\\([0-7]{3})/g, function(_, oct) { return String.fromCharCode(parseInt(oct, 8)); });\n}\nvar targetMount = '{#NFS_MOUNTPOINT}';\nvar targetSource = '{#NFS_SOURCE}';\nvar lines = value.split(/\\r?\\n/);\nfor (var i = 0; i < lines.length; i++) {\n    var f = lines[i].trim().split(/\\s+/);\n    if (f.length < 4) continue;\n    if ((f[2] === 'nfs' || f[2] === 'nfs4') && decodeOctal(f[1]) === targetMount && decodeOctal(f[0]) === targetSource) {\n        var opts = ',' + decodeOctal(f[3]) + ',';\n        return opts.indexOf(',ro,') >= 0 ? 1 : 0;\n    }\n}\nreturn 0;"
        master_item:
          key: vfs.file.contents[/proc/self/mounts]
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      - uuid: 3d449f7d24b1403cb101b9b21800e724
        name: 'NFS [{#NFS_MOUNTPOINT}]: Total space'
        type: ZABBIX_ACTIVE
        key: vfs.fs.size["{#NFS_MOUNTPOINT}",total]
        delay: 5m
        history: 7d
        trends: 365d
        units: B
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      - uuid: 3fd6319e1c864cdf9008587dae2489ae
        name: 'NFS [{#NFS_MOUNTPOINT}]: Used space'
        type: ZABBIX_ACTIVE
        key: vfs.fs.size["{#NFS_MOUNTPOINT}",used]
        delay: 5m
        history: 7d
        trends: 365d
        units: B
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      - uuid: 5758e87efdc041c4ab5fe38ffb4e0eda
        name: 'NFS [{#NFS_MOUNTPOINT}]: Free space'
        type: ZABBIX_ACTIVE
        key: vfs.fs.size["{#NFS_MOUNTPOINT}",free]
        delay: 5m
        history: 7d
        trends: 365d
        units: B
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      - uuid: 658ff99115964113b860ec94c93320b1
        name: 'NFS [{#NFS_MOUNTPOINT}]: Used space, %'
        type: ZABBIX_ACTIVE
        key: vfs.fs.size["{#NFS_MOUNTPOINT}",pused]
        delay: 5m
        history: 7d
        trends: 365d
        value_type: FLOAT
        units: '%'
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      - uuid: 4651a1fedf5e4070b2402a21b1a89288
        name: 'NFS [{#NFS_MOUNTPOINT}]: Current source'
        type: DEPENDENT
        key: nfs.mount.source.current["{#NFS_MOUNTPOINT}"]
        history: 1d
        trends: '0'
        value_type: TEXT
        description: Current NFS source mounted on the mountpoint. Key intentionally excludes the source so a source change preserves item history and can be detected.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "function decodeOctal(s) {\n    return s.replace(/\\\\([0-7]{3})/g, function(_, oct) { return String.fromCharCode(parseInt(oct, 8)); });\n}\nvar targetMount = '{#NFS_MOUNTPOINT}';\nvar lines = value.split(/\\r?\\n/);\nfor (var i = 0; i < lines.length; i++) {\n    var f = lines[i].trim().split(/\\s+/);\n    if (f.length < 4) continue;\n    if ((f[2] === 'nfs' || f[2] === 'nfs4') && decodeOctal(f[1]) === targetMount) {\n        return decodeOctal(f[0]);\n    }\n}\nreturn '';"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: vfs.file.contents[/proc/self/mounts]
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      - uuid: 0d7da4e015a147caa788eca3177d8c32
        name: 'NFS [{#NFS_MOUNTPOINT}]: Current NFS version'
        type: DEPENDENT
        key: nfs.mount.version.current["{#NFS_MOUNTPOINT}"]
        history: 1d
        trends: '0'
        value_type: CHAR
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "function decodeOctal(s) {\n    return s.replace(/\\\\([0-7]{3})/g, function(_, oct) { return String.fromCharCode(parseInt(oct, 8)); });\n}\nvar targetMount = '{#NFS_MOUNTPOINT}';\nvar lines = value.split(/\\r?\\n/);\nfor (var i = 0; i < lines.length; i++) {\n    var f = lines[i].trim().split(/\\s+/);\n    if (f.length < 4) continue;\n    if ((f[2] === 'nfs' || f[2] === 'nfs4') && decodeOctal(f[1]) === targetMount) {\n        var opts = decodeOctal(f[3]);\n        var m = opts.match(/(?:^|,)(?:vers|nfsvers)=([^,]+)/);\n        return m ? m[1] : (f[2] === 'nfs4' ? '4' : 'unknown');\n    }\n}\nreturn '';"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: vfs.file.contents[/proc/self/mounts]
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      - uuid: d008e91eef69496c9d2c4ce154903023
        name: 'NFS [{#NFS_MOUNTPOINT}]: Current transport protocol'
        type: DEPENDENT
        key: nfs.mount.proto.current["{#NFS_MOUNTPOINT}"]
        history: 1d
        trends: '0'
        value_type: CHAR
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "function decodeOctal(s) {\n    return s.replace(/\\\\([0-7]{3})/g, function(_, oct) { return String.fromCharCode(parseInt(oct, 8)); });\n}\nvar targetMount = '{#NFS_MOUNTPOINT}';\nvar lines = value.split(/\\r?\\n/);\nfor (var i = 0; i < lines.length; i++) {\n    var f = lines[i].trim().split(/\\s+/);\n    if (f.length < 4) continue;\n    if ((f[2] === 'nfs' || f[2] === 'nfs4') && decodeOctal(f[1]) === targetMount) {\n        var opts = decodeOctal(f[3]);\n        var m = opts.match(/(?:^|,)proto=([^,]+)/);\n        return m ? m[1] : 'tcp';\n    }\n}\nreturn '';"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: vfs.file.contents[/proc/self/mounts]
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
      trigger_prototypes:
      - uuid: 0bd81fe3ba404224b2d251549e9d0852
        expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=0
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1
        name: 'NFS [{#NFS_MOUNTPOINT}]: Mount disappeared'
        priority: INFO
        description: The NFS mount that was previously discovered is no longer mounted with the same source. Persistent mounts declared in /etc/fstab are covered by a separate HIGH-severity expected-mount trigger.
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
        - tag: scope
          value: availability
      - uuid: 31cfcb715c5b43a489b510fd35572067
        expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1 and (avg(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",pused],15m)>{$NFS.SPACE.CRIT:"{#NFS_MOUNTPOINT}"} or max(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",free],15m)<{$NFS.MIN.FREE:"{#NFS_MOUNTPOINT}"})
        name: 'NFS [{#NFS_MOUNTPOINT}]: Space is critically low'
        priority: HIGH
        description: Critical if used percentage exceeds the configured threshold OR free bytes stay below the configured absolute minimum. The condition is evaluated only while the exact NFS mount is present.
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
        - tag: scope
          value: capacity
      - uuid: 8373c37b31a446ddb9217feb26102957
        expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1 and avg(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",pused],15m)>{$NFS.SPACE.WARN:"{#NFS_MOUNTPOINT}"}
        name: 'NFS [{#NFS_MOUNTPOINT}]: Space usage is high'
        priority: WARNING
        dependencies:
        - name: 'NFS [{#NFS_MOUNTPOINT}]: Space is critically low'
          expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1 and (avg(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",pused],15m)>{$NFS.SPACE.CRIT:"{#NFS_MOUNTPOINT}"} or max(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",free],15m)<{$NFS.MIN.FREE:"{#NFS_MOUNTPOINT}"})
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
        - tag: scope
          value: capacity
      - uuid: 037c07827447404b80a7499af4672c42
        expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1 and timeleft(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",free],1h,0)>0 and timeleft(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",free],1h,0)<{$NFS.FORECAST.DAYS:"{#NFS_MOUNTPOINT}"}
        name: 'NFS [{#NFS_MOUNTPOINT}]: Predicted to run out of free space'
        priority: WARNING
        description: Linear prediction based on the last hour of free-space history estimates exhaustion within {$NFS.FORECAST.DAYS:"{#NFS_MOUNTPOINT}"}.
        dependencies:
        - name: 'NFS [{#NFS_MOUNTPOINT}]: Space is critically low'
          expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1 and (avg(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",pused],15m)>{$NFS.SPACE.CRIT:"{#NFS_MOUNTPOINT}"} or max(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",free],15m)<{$NFS.MIN.FREE:"{#NFS_MOUNTPOINT}"})
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
        - tag: scope
          value: capacity
      - uuid: 34383b1d2b2b4b04b52bdbe231ca554e
        expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1 and nodata(/Linux NFS by Zabbix agent active/vfs.fs.size["{#NFS_MOUNTPOINT}",pused],20m)=1
        name: 'NFS [{#NFS_MOUNTPOINT}]: Mounted but filesystem metrics are unavailable'
        priority: HIGH
        description: The NFS entry is still present in the Linux mount table but the agent has not produced filesystem capacity data for 20 minutes. This detects stale/hung NFS mounts that remain listed as mounted.
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
        - tag: scope
          value: availability
        dependencies:
        - name: 'NFS [{#NFS_MOUNTPOINT}]: Mount disappeared'
          expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=0
          recovery_expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1
      - uuid: 69be9988b2b848cfb3bf3dc981f6a29b
        expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1 and last(/Linux NFS by Zabbix agent active/nfs.mount.readonly["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1
        name: 'NFS [{#NFS_MOUNTPOINT}]: Filesystem is read-only'
        priority: HIGH
        tags:
        - tag: component
          value: nfs
        - tag: nfs.server
          value: '{#NFS_SERVER}'
        - tag: nfs.export
          value: '{#NFS_EXPORT}'
        - tag: nfs.mountpoint
          value: '{#NFS_MOUNTPOINT}'
        - tag: nfs.version
          value: '{#NFS_VERSION}'
        - tag: scope
          value: availability
        dependencies:
        - name: 'NFS [{#NFS_MOUNTPOINT}]: Mount disappeared'
          expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=0
          recovery_expression: last(/Linux NFS by Zabbix agent active/nfs.mount.status["{#NFS_MOUNTPOINT}","{#NFS_SOURCE}"])=1
      graph_prototypes:
      - uuid: 0a6a267a2847484586d15c82330a19b0
        name: 'NFS [{#NFS_MOUNTPOINT}]: Space usage'
        graph_items:
        - color: 1A7C11
          item:
            host: Linux NFS by Zabbix agent active
            key: vfs.fs.size["{#NFS_MOUNTPOINT}",used]
        - sortorder: '1'
          color: 2774A4
          item:
            host: Linux NFS by Zabbix agent active
            key: vfs.fs.size["{#NFS_MOUNTPOINT}",free]
      master_item:
        key: vfs.file.contents[/proc/self/mounts]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
