      master_item:
        key: vfs.file.contents[/proc/self/mounts]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "if ('{$NFS.PERFORMANCE}' !== '1') return '[]';\nfunction decodeOctal(s) {\n    return s.replace(/\\\\([0-7]{3})/g, function(_, oct) {\n        return String.fromCharCode(parseInt(oct, 8));\n    });\n}\nfunction splitSource(source) {\n    var pos = source.indexOf(':/');\n    if (pos < 0) return {server: source, exportPath: ''};\n    var server = source.substring(0, pos);\n    var exportPath = source.substring(pos + 1);\n    if (server.length > 1 && server.charAt(0) === '[' && server.charAt(server.length - 1) === ']')\n        server = server.substring(1, server.length - 1);\n    return {server: server, exportPath: exportPath};\n}\nfunction opt(options, name) {\n    var re = new RegExp('(?:^|,)' + name + '=([^,]+)');\n    var m = options.match(re);\n    return m ? m[1] : '';\n}\nvar out = [];\nvar lines = value.split(/\\r?\\n/);\nfor (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n    if (!line) continue;\n    var f = line.split(/\\s+/);\n    if (f.length < 4) continue;\n    var source = decodeOctal(f[0]);\n    var mountpoint = decodeOctal(f[1]);\n    var fstype = f[2];\n    var options = decodeOctal(f[3]);\n    if (fstype !== 'nfs' && fstype !== 'nfs4') continue;\n    var src = splitSource(source);\n    var version = opt(options, 'vers') || opt(options, 'nfsvers') || (fstype === 'nfs4' ? '4' : 'unknown');\n    var proto = opt(options, 'proto') || 'tcp';\n    var mountaddr = opt(options, 'mountaddr') || src.server;\n    var mountport = opt(options, 'mountport');\n    var mountproto = opt(options, 'mountproto') || proto;\n    out.push({\n        '{#NFS_SOURCE}': source,\n        '{#NFS_SERVER}': src.server,\n        '{#NFS_EXPORT}': src.exportPath,\n        '{#NFS_MOUNTPOINT}': mountpoint,\n        '{#NFS_FSTYPE}': fstype,\n        '{#NFS_VERSION}': version,\n        '{#NFS_PROTO}': proto,\n        '{#NFS_MOUNTADDR}': mountaddr,\n        '{#NFS_MOUNTPORT}': mountport,\n        '{#NFS_MOUNTPROTO}': mountproto\n    });\n}\nreturn JSON.stringify(out);"
