        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "function decodeOctal(s) {\n    return s.replace(/\\\\([0-7]{3})/g, function(_, oct) { return String.fromCharCode(parseInt(oct, 8)); });\n}\nfunction blockForMount(text, targetMount) {\n    text = String(text || '');\n    targetMount = decodeOctal(String(targetMount || '')).trim();\n    var lines = text.split(/\\r?\\n/);\n    var start = -1;\n\n    for (var i = 0; i < lines.length; i++) {\n        var header = lines[i].trim();\n        if (header.indexOf('device ') !== 0) continue;\n\n        var mountedToken = ' mounted on ';\n        var fstypeToken = ' with fstype ';\n        var pMounted = header.indexOf(mountedToken);\n        if (pMounted < 0) continue;\n        var pFstype = header.indexOf(fstypeToken, pMounted + mountedToken.length);\n        if (pFstype < 0) continue;\n\n        var mountpoint = decodeOctal(header.substring(pMounted + mountedToken.length, pFstype)).trim();\n        var fsTail = header.substring(pFstype + fstypeToken.length).trim();\n        var fstype = fsTail.split(/\\s+/)[0];\n\n        if ((fstype === 'nfs' || fstype === 'nfs4') && mountpoint === targetMount) {\n            start = i;\n            break;\n        }\n    }\n\n    if (start < 0) return [];\n\n    var block = [];\n    for (var j = start; j < lines.length; j++) {\n        var current = lines[j];\n        if (j > start && current.trim().indexOf('device ') === 0) break;\n        block.push(current);\n    }\n    return block;\n}\nfunction opRows(block) {\n    var rows = {};\n    var perOp = false;\n    for (var i = 0; i < block.length; i++) {\n        var line = block[i].trim();\n        if (line === 'per-op statistics') { perOp = true; continue; }\n        if (!perOp) continue;\n        var m = line.match(/^([A-Z0-9_]+):\\s+(.+)$/);\n        if (!m) continue;\n        var fields = m[2].trim().split(/\\s+/).map(function(x) { return Number(x); });\n        rows[m[1]] = fields;\n    }\n    return rows;\n}\nvar block = blockForMount(value, '{#NFS_MOUNTPOINT}');\nif (!block.length) throw 'NFS mount not found in /proc/self/mountstats';\nvar rows = opRows(block);\n\nvar total = 0;\nfor (var k in rows) if (rows[k].length > 0 && isFinite(rows[k][0])) total += rows[k][0];\nreturn total;"
