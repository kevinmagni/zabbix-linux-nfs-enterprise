      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "function decodeOctal(s) {\n    return s.replace(/\\\\([0-7]{3})/g, function(_, oct) {\n        return String.fromCharCode(parseInt(oct, 8));\n    });\n}\nfunction getServer(source) {\n    var pos = source.indexOf(':/');\n    var server = pos >= 0 ? source.substring(0, pos) : source;\n    if (server.length > 1 && server.charAt(0) === '[' && server.charAt(server.length - 1) === ']')\n        server = server.substring(1, server.length - 1);\n    return server;\n}\nvar out = [];\nvar seen = {};\nvar lines = value.split(/\\r?\\n/);\nfor (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n    if (!line) continue;\n    var f = line.split(/\\s+/);\n    if (f.length < 4) continue;\n    if (f[2] !== 'nfs' && f[2] !== 'nfs4') continue;\n    var opts = decodeOctal(f[3]);\n    var pm = opts.match(/(?:^|,)proto=([^,]+)/);\n    var proto = pm ? pm[1] : 'tcp';\n    if (proto !== 'tcp') continue;\n    var server = getServer(decodeOctal(f[0]));\n    if (!server || seen[server]) continue;\n    seen[server] = true;\n    out.push({'{#NFS_SERVER}': server, '{#NFS_PROTO}': proto});\n}\nreturn JSON.stringify(out);"
